<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="60" viewBox="0 0 1200 60"><defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.7" fill="#fff" opacity=".45"/></pattern>
<pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#fff"/><rect width="10" height="10" fill="#222"/><rect x="10" y="10" width="10" height="10" fill="#222"/></pattern>
<linearGradient id="strip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9B4E4"/><stop offset=".5" stop-color="#F3A7C8"/><stop offset="1" stop-color="#91A982"/></linearGradient>
<g id="face"><ellipse cx="-9" cy="-6" rx="3.2" ry="5" fill="#222"/><ellipse cx="9" cy="-6" rx="3.2" ry="5" fill="#222"/><path d="M-14 5 Q0 20 14 5" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/></g>
<path id="heart" d="M0 20 C-30 2 -28 -22 -13 -24 C-5 -25 0 -19 0 -14 C0 -19 5 -25 13 -24 C28 -22 30 2 0 20Z"/>
<path id="star" d="M0 -34 L9 -11 L33 -11 L14 4 L21 28 L0 14 L-21 28 L-14 4 L-33 -11 L-9 -11Z"/>
<path id="spark" d="M0 -16 Q2 -2 16 0 Q2 2 0 16 Q-2 2 -16 0 Q-2 -2 0 -16Z"/>
<filter id="sh" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#9A5475" flood-opacity=".35"/></filter>
<clipPath id="round"><rect width="1200" height="60" rx="20"/></clipPath>
</defs>
<style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wig{animation:wig 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d1{animation-delay:-.3s}.d2{animation-delay:-.7s}.d3{animation-delay:-1.1s}.d4{animation-delay:-1.5s}.d5{animation-delay:-1.9s}.d6{animation-delay:-2.3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.55}50%{transform:scale(1.1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><line x1="40" y1="30" x2="1160" y2="30" stroke="#DB83AC" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round"/><rect x="500" y="8" width="200" height="44" rx="22" fill="#FFF0F6"/><g transform="translate(545,32) scale(0.7)"><g class="bob d3"><use href="#heart" fill="#F3A7C8" stroke="#222" stroke-width="2.5" filter="url(#sh)"/><use href="#face" transform="translate(0,-4) scale(.55)"/></g></g><g transform="translate(600,30)"><g class="wig d2"><circle r="18" fill="#F5D76E" stroke="#222" stroke-width="3" filter="url(#sh)"/><use href="#face" transform="scale(0.69)"/></g></g><g transform="translate(655,32) scale(0.55)"><g class="wig d4"><use href="#star" fill="#C9B4E4" stroke="#222" stroke-width="2.5" stroke-linejoin="round" filter="url(#sh)"/><use href="#face" transform="translate(0,2) scale(.5)"/></g></g><g transform="translate(80,30) scale(0.8)"><g class="tw d2"><use href="#spark" fill="#F5D76E" stroke="#222" stroke-width="1.5"/></g></g><g transform="translate(1120,30) scale(0.8)"><g class="tw d4"><use href="#spark" fill="#91A982" stroke="#222" stroke-width="1.5"/></g></g><g transform="translate(300,22) rotate(-4)"><rect width="60" height="14" fill="url(#checker)" stroke="#222" stroke-width="1.5"/></g><g transform="translate(860,24) rotate(3)"><rect width="60" height="14" fill="url(#checker)" stroke="#222" stroke-width="1.5"/></g></svg>